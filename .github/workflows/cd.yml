name: CD

# Se dispara al llegar a main (release/hotfix) o develop (ambiente dev).
# build: valida que el proyecto arranca con Docker (collectstatic).
# push-image: construye y publica la imagen en GHCR.
# deploy: placeholder — el despliegue real (Ansible) todavía se corre a mano,
# ver infra/README.md. Falta decidir visibilidad del paquete GHCR (ver nota
# en infra/README.md) antes de depender de esto en un deploy real.

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "Toma De Requerimientos/**"
      - "**/*.md"
  workflow_dispatch: {}

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Valores dummy: solo para que Django cargue settings durante el chequeo
  # de collectstatic, no se abre conexión real a DB/Redis en este paso.
  DEBUG: "False"
  SECRET_KEY: cd-check-secret-key
  ALLOWED_HOSTS: localhost
  DATABASE_URL: postgres://user:pass@localhost:5432/db
  REDIS_URL: redis://localhost:6379/0

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Collect static files (dry check)
        run: |
          if [ -f manage.py ]; then python manage.py collectstatic --noinput --dry-run; fi

  push-image:
    name: Build & Push image (GHCR)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: push-image
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Placeholder deploy step
        run: |
          echo "TODO: automatizar 'ansible-playbook playbooks/site.yml' desde aquí."
          echo "Por ahora el despliegue se corre a mano (ver infra/README.md)."
          echo "Este job corre en un environment de GitHub: protégelo con"
          echo "reviewers requeridos desde Settings > Environments."
