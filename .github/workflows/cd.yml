name: CD

# Se dispara solo cuando algo llega a main (release u hotfix ya fusionados).
# TODO: una vez definido el hosting (Docker/VPS, Render, Railway, AWS, etc.)
# reemplaza el job "deploy" con los pasos reales (build de imagen, push a
# registry, despliegue). Por ahora deja constancia de que el pipeline existe
# y valida que el proyecto arranca con Docker antes de publicar.

on:
  push:
    branches: [main]
    paths-ignore:
      - "Toma De Requerimientos/**"
      - "**/*.md"
  workflow_dispatch: {}

concurrency:
  group: cd-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Collect static files (dry check)
        run: |
          if [ -f manage.py ]; then python manage.py collectstatic --noinput --dry-run; fi

      # - name: Build Docker image
      #   run: docker build -t restaurante-app:${{ github.sha }} .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Placeholder deploy step
        run: |
          echo "TODO: configurar despliegue real (proveedor, secrets, credenciales)."
          echo "Este job corre en el environment 'production' de GitHub: protégelo"
          echo "con reviewers requeridos desde Settings > Environments."
