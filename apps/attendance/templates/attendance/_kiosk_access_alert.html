{% if kiosk_access_request %}
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm px-4">
<div class="glass-panel neon-border rounded-2xl p-8 max-w-sm w-full text-center">
<span class="material-symbols-outlined text-5xl text-neon-cyan mb-3 block animate-pulse">qr_code_2</span>
<h3 class="font-headline-md text-lg font-bold text-white mb-2">¿Sos vos?</h3>
<p class="text-gray-400 text-sm mb-6">
<span class="text-white">{{ kiosk_access_request.requested_by.get_full_name|default:kiosk_access_request.requested_by.username }}</span>
está intentando entrar al Kiosko de Asistencia.
</p>
<form method="post" action="{% url 'attendance:kiosk_access_respond' kiosk_access_request.pk %}" class="flex gap-3">
{% csrf_token %}
<input type="hidden" name="next" value="{{ request.get_full_path }}"/>
<button type="submit" name="action" value="rechazar" class="flex-1 h-11 rounded-xl border border-red-500/40 text-red-400 text-sm hover:bg-red-500/10 transition-colors">No</button>
<button type="submit" name="action" value="aprobar" class="flex-1 h-11 bg-gradient-to-r from-neon-cyan/20 to-neon-violet/20 border border-neon-cyan/50 text-white rounded-xl text-sm font-headline-sm hover:bg-neon-cyan/30 transition-all">Sí, soy yo</button>
</form>
</div>
</div>
{% endif %}
