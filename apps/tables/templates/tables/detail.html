{% load static %}
<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zennin Bistro - Mesa {{ table.number }}</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: { extend: { colors: { "neon-cyan": "#00f3ff", "neon-violet": "#bc13fe" },
          fontFamily: { "body-md": ["Inter"], "headline-md": ["Inter"], "headline-lg": ["Inter"], "label-md": ["JetBrains Mono"] } } }
      }
</script>
<link href="{% static 'css/auth-theme.css' %}" rel="stylesheet"/>
</head>
<body class="font-body-md">
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-neon-violet opacity-10 blur-[150px]"></div>
<div class="absolute bottom-[0%] -right-[10%] w-[50%] h-[50%] rounded-full bg-neon-cyan opacity-5 blur-[120px]"></div>
</div>

{% include "accounts/_employee_topbar.html" with breadcrumb="Mesas" %}

<main class="relative z-10 max-w-md mx-auto px-6 py-16 text-center">
<div class="glass-panel neon-border rounded-2xl p-10">
<span class="font-headline-lg text-6xl font-bold text-white block mb-2">{{ table.number }}</span>
<p class="text-gray-400 text-sm mb-6">Estás atendiendo esta mesa.</p>
<p class="text-gray-500 text-xs">La toma de pedidos (módulo de Órdenes) todavía no está construida — es el siguiente paso.</p>
</div>
<a href="{% url 'tables:select' %}" class="inline-flex items-center gap-2 mt-8 text-gray-400 hover:text-neon-cyan transition-colors text-xs font-label-md uppercase tracking-widest">
&larr; Elegir otra mesa
</a>
</main>
</body>
</html>
