{% load static cache_bust %}
<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zennin Bistro - Elegir Mesa</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: { extend: { colors: { "neon-cyan": "#00f3ff", "neon-violet": "#bc13fe" },
          fontFamily: { "body-md": ["Inter"], "headline-md": ["Inter"], "headline-lg": ["Inter"], "label-md": ["JetBrains Mono"] } } }
      }
</script>
<link href="{% static_v 'css/auth-theme.css' %}" rel="stylesheet"/>
</head>
<body class="font-body-md">
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-neon-violet opacity-10 blur-[150px]"></div>
<div class="absolute bottom-[0%] -right-[10%] w-[50%] h-[50%] rounded-full bg-neon-cyan opacity-5 blur-[120px]"></div>
</div>

{% include "accounts/_employee_topbar.html" with breadcrumb="Mesas" %}

<main class="relative z-10 max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
<div class="mb-8 text-center">
<h2 class="font-headline-lg text-2xl font-bold text-white mb-1">¿Qué mesa vas a atender?</h2>
<p class="text-gray-400 text-sm">Selecciona el número de mesa para continuar.</p>
</div>

<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
{% for table in tables %}
<a href="{% url 'tables:detail' table.number %}" class="glass-panel rounded-xl border transition-colors flex flex-col items-center justify-center gap-2 aspect-square
{% if table.status == 'LIBRE' %} border-emerald-500/30 hover:border-emerald-500/60
{% elif table.status == 'OCUPADA' %} border-red-500/30 hover:border-red-500/60
{% elif table.status == 'CUENTA_PEDIDA' %} border-amber-500/30 hover:border-amber-500/60
{% elif table.status == 'RESERVADA' %} border-sky-500/30 hover:border-sky-500/60
{% else %} border-gray-500/30 hover:border-gray-500/60
{% endif %}">
<span class="font-headline-lg text-3xl font-bold text-white">{{ table.number }}</span>
<span class="text-[10px] font-label-md uppercase tracking-widest
{% if table.status == 'LIBRE' %} text-emerald-400
{% elif table.status == 'OCUPADA' %} text-red-400
{% elif table.status == 'CUENTA_PEDIDA' %} text-amber-400
{% elif table.status == 'RESERVADA' %} text-sky-400
{% else %} text-gray-400
{% endif %}">{{ table.get_status_display }}</span>
</a>
{% endfor %}
</div>
</main>
</body>
</html>
