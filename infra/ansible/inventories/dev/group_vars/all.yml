---
# Rellenado a mano o con infra/scripts/sync-terraform-outputs.sh dev
project_name: proyecto-restaurante
environment_name: dev

docker_image: "REEMPLAZAR/proyecto-restaurante:latest" # ej. ghcr.io/usuario/proyecto-restaurante:latest

db_host: "REEMPLAZAR_CON_terraform_output_db_endpoint"
db_port: 5432
db_name: restaurante
db_username: restaurante_app
db_secret_arn: "REEMPLAZAR_CON_terraform_output_db_secret_arn" # la password real se lee del secreto, no va aquí

redis_host: "REEMPLAZAR_CON_terraform_output_redis_endpoint"
redis_port: 6379

media_bucket: "REEMPLAZAR_CON_terraform_output_media_bucket"

django_allowed_hosts: "*" # ajustar a dominio real en prod
django_debug: "False"
