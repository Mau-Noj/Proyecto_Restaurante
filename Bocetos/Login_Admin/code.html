<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zennin Bistro - Administrator Login</title>
<!-- Tailwind & Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#000000",
                    "secondary": "#ac3400",
                    "on-surface": "#ffffff",
                    "surface": "#111111",
                    "surface-container": "#1a1a1a",
                    "surface-variant": "#222222",
                    "outline": "#444444",
                    "outline-variant": "#333333",
                    "neon-cyan": "#00f3ff",
                    "neon-violet": "#bc13fe"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "section-gap": "2rem",
                    "gutter": "1.5rem",
                    "margin-mobile": "1rem",
                    "card-padding": "2rem",
                    "margin-desktop": "2.5rem",
                    "baseline": "4px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "label-md": ["JetBrains Mono"],
                    "headline-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "stats-xl": ["Inter"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "stats-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "800"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1; }
        
        body {
            background-color: #050505;
            color: #ffffff;
        }

        .glass-panel {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.05), inset 0 0 20px rgba(188, 19, 254, 0.05);
        }

        .neon-border {
            position: relative;
        }
        .neon-border::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(45deg, rgba(0, 243, 255, 0.5), transparent 40%, transparent 60%, rgba(188, 19, 254, 0.5));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .neon-glow-text {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5), 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .pulse-button {
            animation: pulse-shadow 2s infinite;
        }

        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 243, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0); }
        }

        /* Input styling */
        .input-dark {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .input-dark:focus {
            border-color: rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            outline: none;
        }

        /* Floating Label CSS logic for dark mode */
        .floating-input:focus-within label,
        .floating-input input:not(:placeholder-shown) ~ label {
            transform: scale(0.85) translateY(-1rem);
            color: theme('colors.neon-cyan');
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden antialiased">
<!-- Decorative Background -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-neon-violet opacity-20 blur-[150px]"></div>
<div class="absolute bottom-[0%] -right-[10%] w-[50%] h-[50%] rounded-full bg-neon-cyan opacity-10 blur-[120px]"></div>
</div>
<!-- Main Centered Container -->
<main class="w-full max-w-md px-margin-mobile md:px-0 z-10 relative">
<!-- Login Card -->
<div class="glass-panel neon-border rounded-2xl p-8 relative">
<!-- Branding Header -->
<div class="text-center mb-10">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-4xl font-bold tracking-tight text-white mb-2">Zennin<span class="text-transparent bg-clip-text bg-gradient-to-r from-neon-cyan to-neon-violet font-light ml-2">Bistro</span></h1>
<p class="font-body-md text-gray-400 tracking-widest uppercase text-xs mt-2">Administrator Access Portal</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Credentials Section -->
<div class="space-y-4">
<!-- Floating Label Input: Username -->
<div class="floating-input relative bg-black/50 rounded-xl border border-white/10 focus-within:border-neon-cyan focus-within:shadow-[0_0_15px_rgba(0,243,255,0.2)] transition-all duration-300">
<input class="block w-full bg-transparent border-0 px-4 pt-6 pb-2 font-body-lg text-white focus:ring-0 peer" id="username" placeholder=" " required="" type="text"/>
<label class="absolute left-4 top-4 font-body-md text-gray-400 origin-[0] transition-all duration-200 pointer-events-none" for="username">Username</label>
</div>
<!-- Floating Label Input: Password -->
<div class="floating-input relative bg-black/50 rounded-xl border border-white/10 focus-within:border-neon-cyan focus-within:shadow-[0_0_15px_rgba(0,243,255,0.2)] transition-all duration-300">
<input class="block w-full bg-transparent border-0 px-4 pt-6 pb-2 font-body-lg text-white focus:ring-0 peer" id="password" placeholder=" " required="" type="password"/>
<label class="absolute left-4 top-4 font-body-md text-gray-400 origin-[0] transition-all duration-200 pointer-events-none" for="password">Password</label>
<button class="absolute right-4 top-4 text-gray-500 hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Divider -->
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-white/10"></div>
<span class="flex-shrink-0 mx-4 font-label-md text-label-md text-gray-500 uppercase tracking-widest text-[10px]">Advanced Security</span>
<div class="flex-grow border-t border-white/10"></div>
</div>
<!-- 2FA & Biometric Section -->
<div class="flex gap-4">
<!-- 2FA Input -->
<div class="floating-input relative bg-black/50 rounded-xl border border-white/10 focus-within:border-neon-cyan focus-within:shadow-[0_0_15px_rgba(0,243,255,0.2)] transition-all duration-300 flex-grow">
<input class="block w-full bg-transparent border-0 px-4 pt-6 pb-2 font-body-lg text-white focus:ring-0 peer tracking-widest text-center" id="twofa" maxlength="6" placeholder=" " type="text"/>
<label class="absolute left-4 top-4 font-body-md text-gray-400 origin-[0] transition-all duration-200 pointer-events-none" for="twofa">2FA Code</label>
<span class="absolute right-3 top-4 material-symbols-outlined text-gray-500">lock</span>
</div>
<!-- Biometric Button (MFA/Utility style) -->
<button class="w-[3.25rem] h-[3.25rem] flex-shrink-0 flex items-center justify-center rounded-xl border border-white/10 text-gray-400 hover:border-neon-cyan hover:text-neon-cyan hover:bg-neon-cyan/10 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-neon-cyan/30" type="button">
<span class="material-symbols-outlined icon-fill">fingerprint</span>
</button>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-gradient-to-r from-neon-cyan/20 to-neon-violet/20 border border-neon-cyan/50 text-white rounded-xl font-headline-sm text-sm tracking-widest uppercase hover:bg-neon-cyan/30 transition-all pulse-button flex justify-center items-center gap-3 group mt-8" type="submit">
<span>Authenticate</span>
<span class="material-symbols-outlined text-neon-cyan group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-6 text-center">
<a class="font-body-md text-body-md text-gray-500 hover:text-white transition-colors text-xs tracking-wider" href="#">Contact IT Support</a>
</div>
</div>
<!-- Environmental Security Badge -->
<div class="mt-8 flex justify-center">
<div class="inline-flex items-center gap-2 px-4 py-2 bg-surface-variant/30 rounded-full border border-white/5 backdrop-blur-sm">
<span class="material-symbols-outlined text-[16px] text-neon-cyan">shield_locked</span>
<span class="font-label-md text-[10px] text-gray-400 tracking-widest uppercase">End-to-End Encrypted Session</span>
</div>
</div>
</main>
</body></html>
