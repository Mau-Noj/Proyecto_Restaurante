<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zennin Bistro - Staff Login</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
                "primary": "#000000",
                "secondary": "#ac3400",
                "on-surface": "#ffffff",
                "surface": "#111111",
                "surface-container": "#1a1a1a",
                "surface-variant": "#222222",
                "outline": "#444444",
                "outline-variant": "#333333",
                "neon-cyan": "#00f3ff",
                "neon-violet": "#bc13fe",
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem",
                    "2xl": "1rem"
            },
            "spacing": {
                    "section-gap": "2rem",
                    "gutter": "1.5rem",
                    "margin-mobile": "1rem",
                    "card-padding": "2rem",
                    "margin-desktop": "2.5rem",
                    "baseline": "4px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "label-md": ["JetBrains Mono"],
                    "headline-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "stats-xl": ["Inter"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "stats-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "800"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<style>
        body {
            background-color: #050505;
            color: #ffffff;
        }

        .glass-panel {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.05), inset 0 0 20px rgba(188, 19, 254, 0.05);
        }

        .neon-border {
            position: relative;
        }
        .neon-border::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(45deg, rgba(0, 243, 255, 0.5), transparent 40%, transparent 60%, rgba(188, 19, 254, 0.5));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .neon-glow-text {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5), 0 0 20px rgba(0, 243, 255, 0.3);
        }
        
        .neon-violet-text {
            text-shadow: 0 0 10px rgba(188, 19, 254, 0.5), 0 0 20px rgba(188, 19, 254, 0.3);
        }

        .pulse-button {
            animation: pulse-shadow 2s infinite;
        }

        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 243, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0); }
        }

        .input-dark {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .input-dark:focus {
            border-color: rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            outline: none;
        }

        /* Custom floating label utility */
        .peer:focus ~ label,
        .peer:not(:placeholder-shown) ~ label {
            transform: scale(0.85) translateY(-0.8rem);
            color: rgba(0, 243, 255, 1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden font-body-md">
<!-- Ambient Background Accents -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-neon-violet opacity-20 blur-[150px]"></div>
<div class="absolute bottom-[0%] -right-[10%] w-[50%] h-[50%] rounded-full bg-neon-cyan opacity-10 blur-[120px]"></div>
</div>
<!-- Main Centered Container -->
<main class="w-full max-w-md px-margin-mobile md:px-0 relative z-10 flex flex-col items-center justify-center">
<!-- Header -->
<div class="text-center mb-10 w-full flex flex-col items-center">
<div class="w-16 h-16 mb-4 rounded-full border border-neon-cyan/30 flex items-center justify-center bg-black/50 backdrop-blur-md shadow-[0_0_30px_rgba(0,243,255,0.2)]">
<span class="material-symbols-outlined text-4xl text-neon-cyan" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<h1 class="font-headline-lg text-4xl font-bold tracking-tight text-white mb-2">Zennin<span class="text-transparent bg-clip-text bg-gradient-to-r from-neon-cyan to-neon-violet font-light ml-2">Bistro</span></h1>
<p class="font-body-md text-gray-400 tracking-widest uppercase text-xs mt-2">Staff Portal Access</p>
</div>
<!-- Glassmorphism Card -->
<div class="w-full glass-panel neon-border rounded-2xl p-card-padding relative overflow-hidden">
<!-- Step 1: Credentials -->
<div class="transition-all duration-300 transform opacity-100 translate-x-0" id="step-1">
<form class="space-y-6" onsubmit="event.preventDefault(); nextStep();">
<div class="relative group">
<input class="peer w-full h-14 input-dark rounded-xl px-4 pt-4 text-white font-body-md focus:ring-0 transition-colors" id="employee-id" placeholder=" " required="" type="text"/>
<label class="absolute left-4 top-4 text-gray-400 font-label-md transition-all duration-200 pointer-events-none origin-left text-xs tracking-wider" for="employee-id">EMPLOYEE ID</label>
</div>
<div class="relative group">
<input class="peer w-full h-14 input-dark rounded-xl px-4 pt-4 text-white font-body-md focus:ring-0 transition-colors" id="password" placeholder=" " required="" type="password"/>
<label class="absolute left-4 top-4 text-gray-400 font-label-md transition-all duration-200 pointer-events-none origin-left text-xs tracking-wider" for="password">PIN CODE</label>
</div>
<button class="w-full h-14 mt-6 bg-gradient-to-r from-neon-cyan/20 to-neon-violet/20 border border-neon-cyan/50 text-white rounded-xl font-headline-sm text-sm tracking-widest uppercase hover:bg-neon-cyan/30 transition-all pulse-button flex justify-center items-center gap-3 group" type="submit">
                        Continue
                        <span class="material-symbols-outlined text-neon-cyan group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
</div>
<!-- Step 2: Verification (Initially Hidden) -->
<div class="absolute inset-0 p-card-padding transition-all duration-300 transform opacity-0 translate-x-full pointer-events-none flex flex-col justify-center" id="step-2">
<div class="mb-6 text-center">
<h2 class="font-headline-sm text-xl text-white tracking-widest uppercase mb-1">Verification</h2>
<p class="font-body-md text-gray-400 text-xs">Enter the 6-digit code sent to your device.</p>
</div>
<form class="space-y-6" onsubmit="event.preventDefault(); completeLogin();">
<div class="flex justify-between gap-2">
<!-- Generative multiple inputs for realistic UI feel -->
<input class="w-12 h-14 text-center input-dark rounded-xl font-headline-md text-white focus:ring-0 transition-colors" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center input-dark rounded-xl font-headline-md text-white focus:ring-0 transition-colors" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center input-dark rounded-xl font-headline-md text-white focus:ring-0 transition-colors" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center input-dark rounded-xl font-headline-md text-white focus:ring-0 transition-colors" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center input-dark rounded-xl font-headline-md text-white focus:ring-0 transition-colors" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center input-dark rounded-xl font-headline-md text-white focus:ring-0 transition-colors" maxlength="1" type="text"/>
</div>
<button class="w-full h-14 bg-gradient-to-r from-neon-cyan/20 to-neon-violet/20 border border-neon-cyan/50 text-white rounded-xl font-headline-sm text-sm tracking-widest uppercase hover:bg-neon-cyan/30 transition-all pulse-button flex justify-center items-center gap-3 group" type="submit">
                        Start Shift
                        <span class="material-symbols-outlined text-neon-cyan group-hover:translate-x-1 transition-transform">login</span>
</button>
<button class="w-full text-center font-label-md text-xs tracking-widest uppercase text-gray-400 hover:text-white transition-colors" onclick="prevStep()" type="button">
                        Back to Login
                    </button>
</form>
</div>
</div>
<!-- Footer Info -->
<div class="text-center mt-8">
<p class="font-label-md text-gray-500 tracking-widest uppercase text-[10px]">Need assistance? Contact Shift Manager</p>
</div>
</main>
<script>
        function nextStep() {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            
            step1.classList.remove('opacity-100', 'translate-x-0');
            step1.classList.add('opacity-0', '-translate-x-full', 'pointer-events-none');
            
            step2.classList.remove('opacity-0', 'translate-x-full', 'pointer-events-none');
            step2.classList.add('opacity-100', 'translate-x-0');
            
            // Focus first input of step 2
            setTimeout(() => {
                const firstInput = step2.querySelector('input');
                if(firstInput) firstInput.focus();
            }, 300);
        }

        function prevStep() {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            
            step2.classList.remove('opacity-100', 'translate-x-0');
            step2.classList.add('opacity-0', 'translate-x-full', 'pointer-events-none');
            
            step1.classList.remove('opacity-0', '-translate-x-full', 'pointer-events-none');
            step1.classList.add('opacity-100', 'translate-x-0');
        }
        
        function completeLogin() {
            // Placeholder for success state
            const btn = document.querySelector('#step-2 button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> <span class="tracking-widest uppercase">Verifying...</span>';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined text-neon-cyan">check</span> <span class="tracking-widest uppercase">Success</span>';
                btn.classList.remove('from-neon-cyan/20', 'to-neon-violet/20', 'border-neon-cyan/50');
                btn.classList.add('bg-neon-cyan/20', 'border-neon-cyan', 'text-neon-cyan');
            }, 1000);
        }

        // Auto-advance logic for 6-digit code inputs
        document.querySelectorAll('#step-2 input[type="text"]').forEach((input, index, inputs) => {
            input.addEventListener('input', (e) => {
                if(e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if(e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body></html>
